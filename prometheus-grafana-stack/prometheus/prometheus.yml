global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    env: "prod"
    team: "dataops"

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

rule_files:
  - "alert_rules.yml"

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "node_exporter"
    static_configs:
      - targets: ["node_exporter:9100"]

  # Snowflake metrics via custom exporter
  - job_name: "snowflake_exporter"
    scrape_interval: 60s
    static_configs:
      - targets: ["snowflake-exporter:9975"]

  # Airflow metrics (Airflow 2.x built-in StatsD/Prometheus endpoint)
  - job_name: "airflow"
    scrape_interval: 30s
    static_configs:
      - targets: ["airflow-webserver:8080"]
    metrics_path: "/metrics"
